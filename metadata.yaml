# Patreon Watch Dog - plugin metadata
#
# AstrBot reads this file to identify the plugin in the WebUI and
# the plugin marketplace.
#
# I. Identity
#    1. name must be a valid Python identifier: it is used as the
#       plugin directory name under data/plugins/
# II. Compatibility
#    1. astrbot_version declares the minimum AstrBot version

name: astrbot_plugin_patreon_watch_dog # Unique plugin identifier
display_name: Patreon Watch Dog # Human-friendly name shown in the WebUI
desc: Track Patreon creator updates and send Telegram group notifications.
short_desc: Patreon creator update watcher with Telegram notifications.
version: v1.3.0 # Plugin version, format: v1.1.1 or v1.1
author: zexuan.peng
repo: https://github.com/zexuan.peng/patreon-watch-dog
support_platforms:
  - telegram
astrbot_version: ">=4.10.4" # template_list config schema support
